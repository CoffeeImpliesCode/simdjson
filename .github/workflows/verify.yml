# Verification for the Zig package in this repository.
#
# This file is **entirely this fork's**. simdjson's release tarball carries 45
# workflows under `src/.github/workflows/`, and every one of them is carried here
# unmodified and unedited -- they are upstream's CI, for upstream's maintainers'
# infrastructure, and `AGENTS.md` §3 says not to push copied upstream CI that
# targets another maintainer's infrastructure. They are inert here because they
# are not at this repository's `.github/workflows/` path: nothing in this
# repository reads `src/.github/`, and a runner only looks at `.github/workflows/`.
# `NOTICE.md` records the same fact from the other direction, as a licence and
# provenance matter.
#
# Four jobs, four different questions:
#   native     does the one-translation-unit core and the C ABI seam compile and
#              link in both linkages, do the tests run in Debug and ReleaseSafe,
#              does the example run, and does the *installed* tree serve a plain
#              C and a plain C++ consumer through the shipped headers and the
#              generated pkg-config file
#   cross      does the whole package compile for each of the six targets in
#              `build_support/graph.zig:required_targets`, running nothing
#   cross-shared
#              the same six through `-Dlinkage=dynamic`, where the wasm32-wasi
#              cell is refused with a message naming it rather than answered
#              with an archive
#   consumer   does the published module resolve from a package that did not
#              write it, in both linkages
#
# There is no `continue-on-error` in this file and there is no matrix with a
# tolerated target. Each target is a separate step on purpose: a matrix row
# allowed to fail is indistinguishable from a target that was quietly dropped,
# and "we know that one is broken" is only a fact once a gate has printed the
# failure. If a target ever does turn out to be unsupported here, the honest edit
# is to replace that step with a command that asserts the specific documented
# failure and to record the run in `FORK-NOTES.md` -- not to add a flag that
# hides it.
#
# The full 53-platform matrix is **not** in this file. `cross-test`, run from the
# package root, builds and *runs* `tests.zig` for every platform in Zig 0.16.0's
# published Tier 1/2 table through this repository's own build graph, using
# `cross-test.profile.sh` for its settings. It is not a job here because
# `cross-test` is a host-local tool with its own runner detection and its own
# scratch policy, not something a GitHub runner has; adding a job that invoked a
# path it does not have would fail for a reason that has nothing to do with this
# package, and wrapping that job in an availability check would turn a missing
# gate into a green one. So this file does not pretend to cover it and does not
# stand in for it: the `cross` jobs below run nothing, and a platform with no
# runner on the host is recorded as explicit `build_only` coverage, never as a
# pass. The command and its receipts belong in `README.md` and `FORK-NOTES.md`.
#
# **No run of this workflow has produced a receipt.** Every gate below is
# `PENDING-VERIFICATION` until a driver records its command, optimize mode,
# target, exit code, date and output beside it. This file states what the gates
# are; it asserts nothing about what they printed.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native build, tests, example and installed closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The bytes, the exact vendored file set, the absence of the three
      # generated amalgamation files, the byte-preserved upstream README, and the
      # dual Apache-2.0 / MIT grant. This is a source-integrity check and it
      # compiles nothing -- but it runs first, because every other job below is
      # meaningless if the source it compiled is not the source the digests name.
      - name: provenance
        run: bash tools/check-provenance.sh

      # `--summary all` so a failure names the step it came from, and `-j2` with
      # a matrix of one cell below rather than the runner's default width: one
      # `src/src/simdjson.cpp` compile is a large amount of template expansion and
      # a wider graph on a two-core runner only makes the wall clock worse.
      - name: install (static)
        run: zig build -j2 --summary all --cache-dir "$ZIG_LOCAL_CACHE_DIR/static"

      # The same graph through the shared object. Nothing is recompiled
      # differently -- the same two C++ translation units at the same
      # `-std=c++17 -fno-exceptions -fno-rtti` -- only the link changes, so the
      # only difference between the two runs' output is the soname.
      - name: install (shared)
        run: zig build -j2 --summary all --cache-dir "$ZIG_LOCAL_CACHE_DIR/dynamic" -Dlinkage=dynamic

      # Debug *and* ReleaseSafe, and the second one is not optional: this package
      # passes `SIMDJSON_DEVELOPMENT_CHECKS=1` on every target in every mode, so
      # `DEFAULT_MAX_DEPTH` is an enforced boundary in both. A suite that only
      # ran in Debug would be testing a configuration half this package ships.
      # See FORK-NOTES.md note 8.
      - name: tests (Debug)
        run: zig build test -j2 --summary all --cache-dir "$ZIG_LOCAL_CACHE_DIR/test-debug"

      - name: tests (ReleaseSafe)
        run: zig build test -j2 --summary all --cache-dir "$ZIG_LOCAL_CACHE_DIR/test-release" -Doptimize=ReleaseSafe

      # The example. It reads the same fixtures under testdata/ through the same
      # build-created module the tests read, so a run that could not find them
      # would fail here too rather than quietly printing nothing.
      - name: example
        run: zig build smoke -j2 --summary all --cache-dir "$ZIG_LOCAL_CACHE_DIR/smoke"

      # The installed tree, from the prefix `zig build` was given. The layout is
      # the build graph's, and this is the step that proves it is real: the
      # pkg-config file is `${pcfiledir}`-relative precisely so that it resolves
      # correctly at whatever prefix it landed in, and only a real prefix proves
      # that.
      - name: the installed tree is what package.nix says it is
        run: |
          set -euo pipefail
          prefix="$ZIG_LOCAL_CACHE_DIR/prefix/static"
          test -f "$prefix/lib/libsimdjson.a"
          test -f "$prefix/lib/pkgconfig/simdjson.pc"
          test -f "$prefix/include/simdjson_bridge.h"
          test -f "$prefix/include/simdjson.h"
          test -f "$prefix/include/simdjson/ondemand.h"
          test -f "$prefix/include/simdjson/builtin/ondemand.h"
          test -f "$prefix/share/licenses/simdjson/LICENSE"
          test -f "$prefix/share/licenses/simdjson/LICENSE-MIT"
          test -f "$prefix/share/licenses/simdjson/NOTICE.md"
          test -f "$prefix/share/licenses/simdjson/FORK-LICENSE.md"
          # The whole public header tree travels, unmodified and complete --
          # 234 files under include/simdjson/ plus the umbrella. A hand-picked
          # list would have to be edited when upstream added a file, which is the
          # second-declaration problem the directory install avoids.
          installed=$(find "$prefix/include/simdjson" -type f | wc -l)
          test "$installed" -eq "$(find src/include/simdjson -type f | wc -l)"
          echo "installed $installed public headers, matching src/include/simdjson"

      # A real C consumer, through the shipped headers and the generated
      # pkg-config file and nothing else. This is the step that proves the
      # pkg-config file describes something real: it is found by pkg-config,
      # its `-lsimdjson` resolves, and it compiles and links against
      # `simdjson_bridge.h` with no flag this repository does not put in the
      # file. The program reads its own back and exits non-zero on a mismatch,
      # so it cannot pass by returning zero for a wrong answer.
      - name: a C consumer through pkg-config
        run: |
          set -euo pipefail
          prefix="$ZIG_LOCAL_CACHE_DIR/prefix/static"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          pkg-config --exists simdjson
          echo "simdjson $(pkg-config --modversion simdjson)"
          cat > "$RUNNER_TEMP/c_consumer.c" <<'EOF'
          /* A C consumer of this package, through the installed headers only. */
          #include <stdio.h>
          #include <string.h>
          #include <simdjson_bridge.h>

          int main(void) {
            const char *json = "{\"a\":[1,2,3],\"b\":\"text\"}";
            simdjson_bridge_document *doc = NULL;
            int32_t code = 0;
            size_t nodes = 0, blobs = 0;

            if (simdjson_br_open(json, strlen(json), &doc, &code) != SIMDJSON_BRIDGE_OK) {
              fprintf(stderr, "open failed with upstream code %d\n", code);
              return 1;
            }
            if (simdjson_br_walk(doc, NULL, 0, &nodes, NULL, 0, &blobs, &code) != SIMDJSON_BRIDGE_OK) {
              fprintf(stderr, "sizing walk failed\n");
              return 1;
            }
            /* The root object, "a", the array, three elements, "b" and "text". */
            if (nodes != 8 || blobs != 6) {
              fprintf(stderr, "expected 8 records and 6 blob bytes, got %zu and %zu\n", nodes, blobs);
              return 1;
            }
            /* An index past the implementation list is refused, not read past. */
            {
              size_t len = 0;
              if (simdjson_br_available_implementation_name(
                      simdjson_br_available_implementation_count(), NULL, 0, &len)
                  != SIMDJSON_BRIDGE_INVALID_ARGUMENT) {
                fprintf(stderr, "an out-of-range index was not refused\n");
                return 1;
              }
            }
            /* A malformed document is refused, and not silently accepted. */
            {
              simdjson_bridge_document *bad = NULL;
              if (simdjson_br_open("{\"a\":1,}", 8, &bad, &code) == SIMDJSON_BRIDGE_OK) {
                simdjson_br_destroy(bad);
                fprintf(stderr, "a trailing comma was accepted\n");
                return 1;
              }
            }
            simdjson_br_destroy(doc);
            printf("c consumer ok\n");
            return 0;
          }
          EOF
          cc "$RUNNER_TEMP/c_consumer.c" -o "$RUNNER_TEMP/c_consumer" \
            $(pkg-config --cflags --libs simdjson)
          "$RUNNER_TEMP/c_consumer"

      # A real C++ consumer, through the installed `include/simdjson/` tree and
      # nothing else. This is the step that proves the whole header tree is
      # usable: a C++ consumer of this package has all of upstream's API,
      # including the DOM parser that the Zig facade deliberately does not wrap.
      # It also compiles `#include <simdjson/ondemand.h>`, which is the header
      # whose class templates are the reason `zig/bridge.cc` exists at all -- so
      # if the installed tree were incomplete, this is what would say so.
      - name: a C++ consumer through the installed header tree
        run: |
          set -euo pipefail
          prefix="$ZIG_LOCAL_CACHE_DIR/prefix/static"
          cat > "$RUNNER_TEMP/cpp_consumer.cpp" <<'EOF'
          /* A C++ consumer, using the On-Demand API directly. */
          #include <cstdio>
          #include <simdjson.h>

          int main() {
            const char *json = R"({"a":[1,2,3],"b":"text"})";
            auto parser = simdjson::ondemand::parser();
            simdjson::padded_string padded(json, strlen(json));
            auto doc = parser.iterate(padded);
            if (doc.error()) {
              std::printf("iterate failed: %s\n", simdjson::error_message(doc.error()));
              return 1;
            }
            long long sum = 0;
            size_t count = 0;
            for (auto field : doc["a"]) {
              long long v;
              if (field.get(v) || count++) {
                std::printf("element %zu was not an integer\n", count);
                return 1;
              }
              sum += v;
            }
            if (count != 3 || sum != 6) {
              std::printf("expected 3 elements summing to 6, got %zu and %lld\n", count, sum);
              return 1;
            }
            std::printf("cpp consumer ok, builtin %s\n", SIMDJSON_BUILTIN_IMPLEMENTATION_NAME);
            return 0;
          }
          EOF
          # The C++ runtime is in the package's own link_libcpp, so the consumer
          # resolves it the same way a dependent would: Zig's bundled libc++.
          c++ -std=c++17 -I"$prefix/include" "$RUNNER_TEMP/cpp_consumer.cpp" \
            -o "$RUNNER_TEMP/cpp_consumer" \
            "$prefix/lib/libsimdjson.a" -lc++
          "$RUNNER_TEMP/cpp_consumer"

  cross:
    name: compile the six-target matrix, running nothing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # `zig build check` compiles, for each of the six targets in
      # `build_support/graph.zig:required_targets`: upstream's own single
      # translation unit, this package's C ABI seam, the translated
      # `zig/translate.h`, the facade, the tests and the example. It runs none of
      # them, so every result it produces is compile evidence -- which is why the
      # job is named "compile" and not "test".
      #
      # `wasm32-wasi` is in that list and is not a refusal: the On-Demand path is
      # exception-free, so `-fno-exceptions -fno-rtti` plus Zig's own bundled
      # libc++ is the intended route and this closure needs no external WASI SDK
      # sysroot at all. The static build is what covers the row.
      - name: check all six required targets
        run: zig build check -j2 --summary all --cache-dir "$ZIG_LOCAL_CACHE_DIR/check"

  cross-shared:
    name: the same six through the shared object, with the WASI refusal shown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # One honest difference from the job above. `.wasi` is in the `none` arm of
      # `std.Target.DynamicLinker.kind` (`lib/std/Target.zig:2345`), so a `.so`
      # there is a file nothing can open, and the graph refuses the request
      # rather than answering it with an archive. Windows is *not* refused: it is
      # `.none` too, but only because a PE/COFF image has no interpreter path,
      # and a Windows target does carry a shared object as a DLL.
      #
      # The refusal is asserted here rather than assumed: the step below runs the
      # wasm32-wasi cell and requires a non-zero exit *and* the message the graph
      # prints. A refusal that quietly became a substitution would otherwise look
      # like a pass on this row and a failure on the one below.
      - name: check the five targets that can carry a shared object
        run: |
          set -euo pipefail
          for target in \
            x86_64-linux-gnu \
            aarch64-linux-gnu \
            aarch64-macos-none \
            x86_64-windows-gnu \
            riscv64-linux-gnu
          do
            echo "::group::$target"
            zig build check -Dtarget="$target" -Dlinkage=dynamic -j2 --summary all \
              --cache-dir "$ZIG_LOCAL_CACHE_DIR/check-$target"
            echo "::endgroup::"
          done

      - name: wasm32-wasi is refused for -Dlinkage=dynamic, not answered with an archive
        run: |
          set -uo pipefail
          output=$(zig build check -Dtarget=wasm32-wasi -Dlinkage=dynamic \
            --cache-dir "$ZIG_LOCAL_CACHE_DIR/check-wasi" 2>&1)
          status=$?
          echo "$output"
          test "$status" -ne 0 || {
            echo "wasm32-wasi accepted -Dlinkage=dynamic; the refusal is gone" >&2
            exit 1
          }
          echo "$output" | grep -q 'has no dynamic linker' || {
            echo "the failure was not the documented refusal" >&2
            exit 1
          }
          echo "the refusal is the documented one"

      # And the static build for the same cell still works, which is what makes
      # the refusal a refusal rather than a hole in the matrix.
      - name: wasm32-wasi still builds statically
        run: zig build check -Dtarget=wasm32-wasi -j2 --summary all --cache-dir "$ZIG_LOCAL_CACHE_DIR/check-wasi-static"

  consumer:
    name: the published module from a package that did not write it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The proof that `dep.module("simdjson")` resolves from outside the package
      # that defines it, in both linkages. The consumer reaches the library only
      # through that one import line -- no path reaches into this tree -- and it
      # answers against RFC 8259 and IEEE 754 rather than against a copy of what
      # the parser produced.
      #
      # Both linkages share this one job rather than being two, because the
      # consumer's answers are identical either way and a difference between the
      # artifacts has to be visible as a *failure* of the same program.
      - name: consumer (linked, static)
        working-directory: consumer
        run: zig build run -j2 --summary all --cache-dir "$RUNNER_TEMP/consumer-static"

      - name: consumer (linked, shared)
        working-directory: consumer
        run: zig build run -Dlinkage=dynamic -j2 --summary all --cache-dir "$RUNNER_TEMP/consumer-dynamic"

      # The runtime-loading configuration. The provider is the unversioned
      # `libsimdjson.so` the previous step's `zig build -Dlinkage=dynamic`
      # installed, so the artifact and the dispatch are both real and the same
      # answers have to follow.
      #
      # Nothing is loaded by default and no other file is tried: the provider is
      # named explicitly on the command line, which is the whole contract of the
      # mode. A run with no `--provider` must refuse with its own configuration
      # error rather than looking in a default location.
      - name: install a provider to load
        run: |
          zig build -j2 --summary all \
            --cache-dir "$ZIG_LOCAL_CACHE_DIR/dynamic" \
            -Dlinkage=dynamic \
            --prefix "$RUNNER_TEMP/prefix"

      - name: consumer (runtime-loaded, provider named)
        working-directory: consumer
        run: zig build run -Druntime=true -j2 --summary all --cache-dir "$RUNNER_TEMP/consumer-runtime" -- --provider "$RUNNER_TEMP/prefix/lib/libsimdjson.so"

      - name: consumer (runtime-loaded, no provider is refused)
        working-directory: consumer
        run: |
          set -uo pipefail
          output=$(zig build run -Druntime=true -j2 --summary all \
            --cache-dir "$RUNNER_TEMP/consumer-runtime" 2>&1)
          status=$?
          echo "$output"
          test "$status" -ne 0 || {
            echo "a runtime-loading run with no provider succeeded" >&2
            exit 1
          }
          echo "$output" | grep -q 'NoProviderConfigured\|--provider' || {
            echo "the failure was not the documented 'no provider configured'" >&2
            exit 1
          }
          echo "the refusal is the documented one"